<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Search</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f6fb;
    color: #20242c;
  }
  .card {
    width: min(92vw, 620px);
    padding: 32px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(0,0,0,.10);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }
  .desc {
    margin: 0 0 26px;
    color: #68707d;
    font-size: 14px;
  }
  label {
    display: block;
    margin: 18px 0 8px;
    font-weight: 700;
    font-size: 14px;
  }
  input {
    width: 100%;
    padding: 14px 15px;
    border: 1px solid #d7dce5;
    border-radius: 12px;
    outline: none;
    font-size: 16px;
    transition: .15s;
  }
  input:focus {
    border-color: #6d7cff;
    box-shadow: 0 0 0 3px rgba(109,124,255,.12);
  }
  .preview {
    margin-top: 18px;
    padding: 13px 15px;
    background: #f6f7fa;
    border-radius: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    overflow-wrap: anywhere;
    color: #444b57;
  }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: #5865f2;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { filter: brightness(.95); }
  button:active { transform: translateY(1px); }
  .hint {
    margin-top: 12px;
    text-align: center;
    color: #8a919d;
    font-size: 12px;
  }
</style>
</head>
<body>

<main class="card">
  <h1>Site Search</h1>
  <p class="desc">指定したサイト内だけをGoogleで検索します。</p>

  <label for="site">サイトURL</label>
  <input id="site" type="url" placeholder="https://example.com" autocomplete="off">

  <label for="query">検索ワード</label>
  <input id="query" type="text" placeholder="検索したい言葉" autocomplete="off">

  <div class="preview" id="preview">site:example.com 検索ワード</div>

  <button id="searchBtn" type="button">Googleで検索</button>

  <div class="hint">Enterキーでも検索できます</div>
</main>

<script>
const siteInput = document.getElementById("site");
const queryInput = document.getElementById("query");
const preview = document.getElementById("preview");
const searchBtn = document.getElementById("searchBtn");

function getDomain(value) {
  value = value.trim();
  if (!value) return "";

  try {
    let url = value;
    if (!/^https?:\\/\\//i.test(url)) {
      url = "https://" + url;
    }

    const hostname = new URL(url).hostname;
    return hostname.replace(/^www\\./i, "");
  } catch {
    return value
      .replace(/^https?:\\/\\//i, "")
      .split("/")[0]
      .replace(/^www\\./i, "");
  }
}

function getSearchQuery() {
  const domain = getDomain(siteInput.value);
  const query = queryInput.value.trim();

  if (!domain && !query) return "";
  if (!domain) return query;
  if (!query) return `site:${domain}`;

  return `site:${domain} ${query}`;
}

function updatePreview() {
  preview.textContent = getSearchQuery() || "site:example.com 検索ワード";
}

function search() {
  const domain = getDomain(siteInput.value);
  const query = queryInput.value.trim();

  if (!domain) {
    siteInput.focus();
    return;
  }

  if (!query) {
    queryInput.focus();
    return;
  }

  const searchQuery = `site:${domain} ${query}`;
  const url = "https://www.google.com/search?q=" +
              encodeURIComponent(searchQuery);

  window.location.href = url;
}

siteInput.addEventListener("input", updatePreview);
queryInput.addEventListener("input", updatePreview);
searchBtn.addEventListener("click", search);

siteInput.addEventListener("keydown", e => {
  if (e.key === "Enter") queryInput.focus();
});

queryInput.addEventListener("keydown", e => {
  if (e.key === "Enter") search();
});

updatePreview();
</script>

</body>
</html>
